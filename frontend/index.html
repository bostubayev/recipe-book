<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга рецептов</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top app-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#/">
                <span class="brand-logo"><i class="bi bi-book-half"></i></span>
                <span class="brand-title">Книга рецептов</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
                aria-controls="main-nav" aria-expanded="false" aria-label="Открыть меню">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="main-nav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                    <!-- для аутентифицированных -->
                    <li class="nav-item auth-only d-none">
                        <a class="btn btn-accent" href="#/recipes/new">
                            <i class="bi bi-plus-lg"></i> Добавить рецепт
                        </a>
                    </li>
                    <li class="nav-item auth-only d-none">
                        <span class="nav-user">
                            <span class="avatar avatar-sm" id="nav-avatar"></span>
                            <span id="current-username"></span>
                        </span>
                    </li>
                    <li class="nav-item auth-only d-none">
                        <button class="btn btn-outline-dark" id="logout-btn">
                            <i class="bi bi-box-arrow-right"></i> Выйти
                        </button>
                    </li>

                    <!-- для гостей -->
                    <li class="nav-item guest-only">
                        <a class="btn btn-outline-dark" href="#/register">Регистрация</a>
                    </li>
                    <li class="nav-item guest-only">
                        <a class="btn btn-accent" href="#/login">Войти</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4" id="container"></main>

    <footer class="app-footer">
        <div class="container text-center">
            Книга рецептов · Django REST Framework + jQuery
        </div>
    </footer>

    <!-- уведомления -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

    <!-- подтверждение удаления -->
    <div class="modal fade" id="confirm-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center p-4">
                    <div class="confirm-icon"><i class="bi bi-trash3"></i></div>
                    <h5 class="mb-2">Удалить рецепт?</h5>
                    <p class="text-secondary mb-4">Рецепт и все комментарии к нему будут удалены безвозвратно.</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Отмена</button>
                        <button type="button" class="btn btn-danger" id="confirm-delete-btn">Удалить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
